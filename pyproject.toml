[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marlin-style-fluxbin"
version = "0.1.0"
description = "Two-base rank-one binary weight quantization and deployment research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "safetensors>=0.8",
  "torch>=2.3",
  "transformers>=5.14",
]

[tool.setuptools.packages.find]
where = ["src"]
